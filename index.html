    <style>
      /* Floating Music Toggle Button */
      .music-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(43, 20, 10, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1.5px solid rgba(212, 168, 83, 0.8);
        box-shadow: 0 6px 20px rgba(18, 8, 3, 0.4), 0 0 12px rgba(212, 168, 83, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #f7efdb;
        padding: 0;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .music-toggle-btn:hover {
        transform: scale(1.08);
        border-color: #f3e3c3;
        box-shadow: 0 8px 24px rgba(18, 8, 3, 0.5), 0 0 18px rgba(212, 168, 83, 0.5);
      }
      .music-toggle-btn:active {
        transform: scale(0.92);
      }
      .music-toggle-btn svg {
        width: 22px;
        height: 22px;
      }
      .music-toggle-btn.playing {
        animation: musicDiscSpin 4s linear infinite;
      }
      .music-toggle-btn.playing .music-icon-playing {
        display: block;
      }
      .music-toggle-btn.playing .music-icon-paused {
        display: none;
      }
      .music-toggle-btn:not(.playing) .music-icon-playing {
        display: none;
      }
      .music-toggle-btn:not(.playing) .music-icon-paused {
        display: block;
      }
      @keyframes musicDiscSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Footer couple outline names styling — ensures full names are fully visible without clipping on mobile screens */
      .text-outline-gold {
        font-size: clamp(20px, 7.8vw, 42px) !important;
        letter-spacing: 0.02em !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        white-space: nowrap !important;
      }
      @media (min-width: 640px) {
        .text-outline-gold {
          font-size: min(7vw, 56px) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music (Seetha Kalyanam) -->
    <audio id="wedding-audio" loop preload="auto" playsinline src="./editable/assets/bgm.mp3"></audio>

    <!-- Floating Music Toggle Controller -->
    <button id="music-toggle" class="music-toggle-btn" aria-label="Toggle background music" title="Toggle background music" aria-pressed="false">
      <svg class="music-icon-playing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
      <svg class="music-icon-paused" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        <line x1="2" y1="2" x2="22" y2="22"></line>
      </svg>
    </button>

    <script>
      (function() {
        function initMusic() {
          const audio = document.getElementById('wedding-audio');
          const toggle = document.getElementById('music-toggle');
          if (!audio || !toggle) return;

          let hasInteracted = false;

          function updateState() {
            if (!audio.paused) {
              toggle.classList.add('playing');
              toggle.setAttribute('aria-pressed', 'true');
              toggle.setAttribute('aria-label', 'Pause background music');
            } else {
              toggle.classList.remove('playing');
              toggle.setAttribute('aria-pressed', 'false');
              toggle.setAttribute('aria-label', 'Play background music');
            }
          }

          function playMusic() {
            if (!audio) return;
            audio.play().then(() => {
              hasInteracted = true;
              updateState();
            }).catch(function(err) {
              console.log('Autoplay waiting for user gesture:', err);
            });
          }

          toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            hasInteracted = true;
            cleanup();
            if (audio.paused) {
              playMusic();
            } else {
              audio.pause();
              updateState();
            }
          });

          function onFirstInteraction(e) {
            if (hasInteracted) return;
            if (e && e.target && toggle.contains(e.target)) return;
            hasInteracted = true;
            cleanup();
            if (audio.paused) {
              playMusic();
            }
          }

          function cleanup() {
            document.removeEventListener('click', onFirstInteraction, true);
            document.removeEventListener('touchstart', onFirstInteraction, true);
            document.removeEventListener('scroll', onFirstInteraction, true);
            document.removeEventListener('keydown', onFirstInteraction, true);
          }

          document.addEventListener('click', onFirstInteraction, true);
          document.addEventListener('touchstart', onFirstInteraction, true);
          document.addEventListener('scroll', onFirstInteraction, true);
          document.addEventListener('keydown', onFirstInteraction, true);

          audio.addEventListener('play', updateState);
          audio.addEventListener('pause', updateState);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initMusic);
        } else {
          initMusic();
        }
      })();
    </script>
